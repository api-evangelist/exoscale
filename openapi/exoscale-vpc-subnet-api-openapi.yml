openapi: 3.2.0
info:
  version: 2.0.0
  termsOfService: https://exoscale.com/terms
  contact:
    email: support@exoscale.com
    name: Exoscale Support
    url: https://portal.exoscale.com/tickets
  title: Exoscale Vpc Subnet API
  description: Infrastructure automation API, allowing programmatic access to all Exoscale products and services.
servers:
- url: https://api-{zone}.exoscale.com/v2
  variables:
    zone:
      default: ch-gva-2
      enum:
      - ch-gva-2
      - ch-dk-2
      - de-fra-1
      - de-muc-1
      - at-vie-1
      - at-vie-2
      - bg-sof-1
      - hr-zag-1
tags:
- description: '[BETA] Configure VPC subnets and attach instances to them'
  parent: vpc
  externalDocs:
    description: Read more
    url: https://community.exoscale.com/documentation/compute/
  name: vpc-subnet
  x-display-name: VPC
  x-weight: 195
  x-icon: exo-vpc
paths:
  /vpc/{vpc-id}/subnet/{subnet-id}/attach:
    put:
      tags:
      - vpc-subnet
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/operation'
      description: ''
      parameters:
      - in: path
        required: true
        name: vpc-id
        schema:
          type: string
          format: uuid
      - in: path
        required: true
        name: subnet-id
        schema:
          type: string
          format: uuid
      summary: '[BETA] Attach a Compute instance to a Subnet'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                instance:
                  $ref: '#/components/schemas/instance-ref'
                  description: Compute instance
                ipv4:
                  type: string
                  format: ipv4
                  description: Instance IPv4
              required:
              - instance
      operationId: attach-instance-to-subnet
  /vpc/{vpc-id}/subnet:
    get:
      tags:
      - vpc-subnet
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  subnets:
                    type: array
                    items:
                      $ref: '#/components/schemas/list-subnet-entry'
      description: ''
      parameters:
      - in: path
        required: true
        name: vpc-id
        schema:
          type: string
          format: uuid
      summary: '[BETA] List Subnets'
      operationId: list-subnets
    post:
      tags:
      - vpc-subnet
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/operation'
      description: ''
      parameters:
      - in: path
        required: true
        name: vpc-id
        schema:
          type: string
          format: uuid
      summary: '[BETA] Create a Subnet'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                  minLength: 1
                  description: Subnet name
                description:
                  type: string
                  maxLength: 4096
                  description: Subnet description
                labels:
                  $ref: '#/components/schemas/labels'
                  description: Resource labels
                addressfamily:
                  type: string
                  enum:
                  - inet4
                  description: Subnet address family
                address-space:
                  type: string
                  enum:
                  - private
                  description: Subnet address space
                ipv4-block:
                  type: string
                  description: Subnet ipv4 CIDR
              required:
              - name
              - addressfamily
              - address-space
      operationId: create-subnet
  /vpc/{vpc-id}/subnet/{id}:
    delete:
      tags:
      - vpc-subnet
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/empty'
      description: ''
      parameters:
      - in: path
        required: true
        name: vpc-id
        schema:
          type: string
          format: uuid
      - in: path
        required: true
        name: id
        schema:
          type: string
          format: uuid
      summary: '[BETA] Delete a Subnet'
      operationId: delete-subnet
    put:
      tags:
      - vpc-subnet
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/subnet'
      description: ''
      parameters:
      - in: path
        required: true
        name: vpc-id
        schema:
          type: string
          format: uuid
      - in: path
        required: true
        name: id
        schema:
          type: string
          format: uuid
      summary: '[BETA] Update a Subnet'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type:
                  - string
                  - 'null'
                  maxLength: 255
                  minLength: 1
                  description: Subnet name
                description:
                  type:
                  - string
                  - 'null'
                  maxLength: 4096
                  description: Subnet description
                labels:
                  $ref: '#/components/schemas/labels'
                  description: Resource labels
                ipv4-block:
                  type:
                  - string
                  - 'null'
                  description: Subnet CIDR
      operationId: update-subnet
    get:
      tags:
      - vpc-subnet
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/subnet'
      description: ''
      parameters:
      - in: path
        required: true
        name: vpc-id
        schema:
          type: string
          format: uuid
      - in: path
        required: true
        name: id
        schema:
          type: string
          format: uuid
      summary: '[BETA] Retrieve Subnet details'
      operationId: get-subnet
  /vpc/{vpc-id}/subnet/{subnet-id}/detach:
    put:
      tags:
      - vpc-subnet
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/operation'
      description: ''
      parameters:
      - in: path
        required: true
        name: vpc-id
        schema:
          type: string
          format: uuid
      - in: path
        required: true
        name: subnet-id
        schema:
          type: string
          format: uuid
      summary: '[BETA] Detach a Compute instance from a Subnet'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                instance:
                  $ref: '#/components/schemas/instance-ref'
                  description: Compute instance
              required:
              - instance
      operationId: detach-instance-from-subnet
components:
  schemas:
    list-subnet-entry:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Subnet ID
        name:
          type: string
          maxLength: 255
          minLength: 1
          description: Subnet name
        description:
          type: string
          maxLength: 4096
          description: Subnet description
        created-at:
          type: string
          format: date-time
          description: Subnet creation date
        addressfamily:
          type: string
          enum:
          - inet4
          - dual
          description: Subnet address family
        address-space:
          type: string
          enum:
          - private
          description: Subnet address space
        ipv4-block:
          type: string
          description: Subnet ipv4 CIDR
        labels:
          $ref: '#/components/schemas/labels'
          description: Resource labels
      description: Subnet
    operation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Operation ID
        reason:
          type: string
          enum:
          - incorrect
          - unknown
          - unavailable
          - forbidden
          - busy
          - fault
          - partial
          - not-found
          - interrupted
          - unsupported
          - conflict
          readOnly: true
          description: Operation failure reason
        reference:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Reference ID
            link:
              type: string
              readOnly: true
              description: Link to the referenced resource
            command:
              type: string
              description: Command name
          description: Related resource reference
          readOnly: true
        message:
          type: string
          readOnly: true
          description: Operation message
        state:
          type: string
          enum:
          - failure
          - pending
          - success
          - timeout
          readOnly: true
          description: Operation status
      description: Operation
    labels:
      type: object
      additionalProperties:
        type: string
    empty:
      type: object
      description: An empty map response
    instance-ref:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Instance ID
      description: Target Instance
    subnet:
      type: object
      properties:
        description:
          type: string
          maxLength: 4096
          description: Subnet description
        labels:
          $ref: '#/components/schemas/labels'
          description: Resource labels
        name:
          type: string
          maxLength: 255
          minLength: 1
          description: Subnet name
        ipv4-block:
          type: string
          description: Subnet ipv4 CIDR
        addressfamily:
          type: string
          enum:
          - inet4
          - dual
          description: Subnet address family
        address-space:
          type: string
          enum:
          - private
          description: Subnet address space
        instances:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Instance uuid
              ipv4:
                type: string
                format: ipv4
                description: Instance Ipv4 address
            description: Subnet attachements
          description: Instances attached to the subnet
        id:
          type: string
          format: uuid
          description: Subnet ID
        created-at:
          type: string
          format: date-time
          description: Subnet creation date
      description: Subnet
x-topics:
- title: API Request Signature
  content: '

    In order to authenticate legitimate users, the Exoscale API requires incoming requests to be signed using valid Exoscale API account credentials with the following mechanism.


    ## Signature Mechanism


    The *message* (i.e. content) to sign contains several segments concatenated using a line return character (`\n`).


    All segments must be included and in the described order. For cases where a segment doesn''t fit the context of the request (e.g. no request body) **an empty line must be used instead**.


    * Request method and request URL (path only), separated by a space character

    * Request body

    * Request URL parameters (Query String) values, concatenated without separator. The matching parameter names have to be specified in the resulting signature header `signed-query-args=` pragma, separated by semicolons (e.g. `p1;p2;pN`).

    * Request header values, concatenated without separator (none at the moment, leave empty)

    * Request expiration date in UNIX timestamp format


    Example *message* to sign for `GET /v2/resource/a02baf5a-a3e4-49a0-857b-8a08d276c1c0?p1=v1&p2=v2`:


    ```

    GET /v2/resource/a02baf5a-a3e4-49a0-857b-8a08d276c1c0


    v1v2


    1599140767

    ```


    The two blank lines above are due to the absence of a request body and signed headers.


    Example *message* to [create a security group](https://community.exoscale.com/reference/api/compute/security-group/#create-security-group)


    ```

    POST /v2/security-group

    {"name": "my-security-group"}



    1599140767

    ```


    The two blank lines above are due to the absence of query parameters and signed headers.


    The request signature consists of the base64-encoded [HMAC](https://en.wikipedia.org/wiki/HMAC) hash of the UTF-8 encoded *message* and the Exoscale API secret using the SHA265 function:


    ```

    signature = BASE64_ENCODE(HMAC_SHA256(Exoscale API secret, message))

    ```


    Finally, the computed signature must be added to the API request in a `Authorization` header such as:


    ```

    Authorization: EXO2-HMAC-SHA256 credential=<Exoscale API key>,expires=<expiration date UNIX timestamp>,signature=<signature>

    ```


    Example API query:


    ```

    GET /v2/resource/a02baf5a-a3e4-49a0-857b-8a08d276c1c0?p1=v1&p2=v2 HTTP/1.1

    Host: api-ch-gva-2.exoscale.com

    Authorization: EXO2-HMAC-SHA256 credential=EXO29147e9f89102b7ac1e88514,signed-query-args=p1;p2,expires=1599140767,signature=2AOBQsbElQb4FpKT/FM/9T4NobjlmZkSGvvdUth/xlY=

    ```


    ## Reference Implementations


    You can look up the following existing reference implementations:


    * Go: [github.com/exoscale/egoscale/api/v2 > `SecurityProviderExoscale.signRequest`](https://github.com/exoscale/egoscale/blob/master/v2/api/security.go)

    * Python: [requests-exoscale-auth > `ExoscaleV2Auth`](https://github.com/exoscale/requests-exoscale-auth/blob/master/exoscale_auth.py)


    '
- title: Zone local resources
  content: '

    The API is deployed across all Exoscale zones. When performing a compute call, you should use the relevant zone for your resource.

    For example: https://api-de-fra-1.exoscale.com/v2/instance would return only the instances from `de-fra-1`, https://api-ch-gva-2.exoscale.com/v2/instance from `ch-gva-2`.

    To obtain a list of all instances across all zones, you would need to do the corresponding request for each zone.

    '
